<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>just memories</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body class="locked">

  <!-- ФАЗА 0: приветственное окно -->
  <div id="intro-modal">
    <div class="intro-inner">
      <p class="kicker">FANALIS COMPOSE PRESENTS</p>
      <h1 class="intro-title">The Web</h1>
      <p class="intro-sub">pedrovega</p>
      <button id="enter-btn">▶ ВОЙТИ</button>
      <p class="intro-note">A SHORT FILM ABOUT THE WEB</p>
    </div>
  </div>

  <!-- ФАЗА 1–2: 3D-сцена (canvas на весь экран, фиксированный) -->
  <canvas id="scene-canvas"></canvas>

  <!-- подсказка скролла -->
  <div id="scroll-hint">SCROLL ↓</div>

  <!-- спейсер: создаёт высоту прокрутки для фазы зума в монитор -->
  <div id="scroll-driver"></div>

  <!-- ФАЗА 3: CRT-комната памяти (3D, рендерится в тот же canvas после зума) -->
  <div id="room-ui">
    <p id="look-hint">DRAG · ОСМОТР ⟲ &nbsp;&nbsp; CLICK · ПОДОЙТИ</p>
    <button id="room-exit">← EXIT</button>
  </div>

  <!-- глобальное управление музыкой (все сцены) -->
  <button id="music-gear" aria-label="Управление музыкой" title="Музыка">
    <i data-lucide="disc-3" style="width:22px;height:22px;"></i>
  </button>
  <div id="music-panel">
    <button id="music-play" aria-label="Воспроизведение">▶</button>
    <span class="vol-row">
      <i data-lucide="volume-2" style="width:16px;height:16px;"></i>
      <input id="vol-slider" type="range" min="0" max="100" value="70" aria-label="Громкость">
      <span id="vol-val">70</span>
    </span>
  </div>

  <!-- подсказка наведения на бумбокс -->
  <p id="boom-hint">▶ ВКЛЮЧИТЬ</p>

  <!-- фоновая музыка: бумбокс играет Heads Will Roll -->
  <audio id="bgm" loop preload="auto"
         src="audio/Yeah%20Yeah%20Yeahs%20-%20Heads%20Will%20Roll%20(A-Trak%20Remix%20Radio%20Edit)%20(Lyrics).mp3"></audio>

  <!-- CRT-зерно + скан-линии поверх всего -->
  <div id="grain"></div>

  <!-- чёрный оверлей для плавного перехода между сценами -->
  <div id="fade"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
    }
  }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="src/main.js?b=39"></script>
</body>
</html>
