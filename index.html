<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Web — a remake</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body class="locked">

  <!-- ФАЗА 0: приветственное окно -->
  <div id="intro-modal">
    <div class="intro-inner">
      <p class="kicker">FANALIS COMPOSE PRESENTS</p>
      <h1 class="intro-title">The Web</h1>
      <p class="intro-sub">a remake</p>
      <button id="enter-btn">▶ ВОЙТИ</button>
      <p class="intro-note">A SHORT FILM ABOUT THE WEB</p>
    </div>
  </div>

  <!-- ФАЗА 1–2: 3D-сцена (canvas на весь экран, фиксированный) -->
  <canvas id="scene-canvas"></canvas>

  <!-- подсказка скролла -->
  <div id="scroll-hint">SCROLL ↓</div>

  <!-- спейсер: создаёт высоту прокрутки для фазы зума в монитор -->
  <div id="scroll-driver"></div>

  <!-- ФАЗА 3: контент «внутри монитора» (появляется после зума) -->
  <main id="site-content">
    <section class="site-hero">
      <h2>Мы внутри.</h2>
      <p>Это контент, который живёт по ту сторону экрана.</p>
    </section>
    <section class="site-block">
      <h3>Работы</h3>
      <p>Кейсы, проекты, всё что угодно.</p>
    </section>
    <section class="site-block">
      <h3>О нас</h3>
      <p>Студия, которая перестраивает скучные сайты.</p>
    </section>
    <section class="site-block">
      <h3>Контакты</h3>
      <p>hello@example.com</p>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
    }
  }
  </script>
  <script type="module" src="src/main.js?b=8"></script>
</body>
</html>
